<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leyenda — Elige tu equipo</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/equipo.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand__logo" src="assets/logo/logo_leyenda_transparent.png" alt="Leyenda">
  </div>
  <p class="brand__tagline">Tu primera decisión como profesional</p>
</header>

<main class="offers">
  <div class="offers__intro">
    <h1>Elige tu primer equipo</h1>
    <p>Cuatro clubes te abren la puerta. La elección va a marcar el punto de partida de tu carrera — tu nivel inicial depende de a dónde vayas.</p>
  </div>

  <div class="offers__grid" id="offersGrid"></div>
</main>

<footer class="app-footer" id="appFooter"></footer>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/database.js"></script>
<script src="js/equipo.js"></script>
</body>
</html>
